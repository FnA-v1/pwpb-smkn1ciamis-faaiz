<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H  A  H  A  H  A</title>
</head>
<body>
  <form action="show.html" method="post">
    <label for="nis">NIS:</label>
    <input type="number" id="nis" name="nis" placeholder="Masukkan NIS" required>
    <br><br>
    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
    <br><br>
    <label for="kelas">Kelas:</label>
    <select id="kelas" name="kelas" required>
      <option value="X">X</option>
      <option value="XI">XI</option>
      <option value="XII">XII</option>
    </select>
    <br><br>
    <label for="jenis_kelamin">Jenis Kelamin:</label>
    <input type="radio" id="laki-laki" name="jenis_kelamin" value="Laki-laki" required>
    <label for="laki-laki">Laki-laki</label>
    <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan" required>
    <label for="perempuan">Perempuan</label>
    <br><br>
    <label for="alamat">Alamat:</label>
    <textarea id="alamat" name="alamat" placeholder="Masukkan alamat lengkap" required></textarea>
    <br><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>
